name: CI
on: [ pull_request, push, workflow_dispatch ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGEX_ANSI_COLOR: 's/\x1b\[[0-9;]*[mGKHF]//g'
  REGEX_MAKE_OUTPUT: '/^g*make\[1]: \(Enter\|Leav\)ing directory ''/d'

permissions:
  contents: read

jobs:
  check-uid:
    name: Check Vial UIDs
    runs-on: ubuntu-latest

    steps:
    - name: (actions) Checkout Vial repo
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Verify Vial UID is unique per-keyboard
      run: python3 util/ci_vial_verify_uid.py

  build-default:
    name: Build default keymaps for Vial
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli@sha256:2dc05fc9f32efebd6b05c2b8676ee548358bc7e151e9dbf4dac6b6eed4513b07
    env:
      KEYMAP: default

    steps:
    - name: (actions) Checkout Vial repo
      uses: actions/checkout@v4
      with:
        persist-credentials: false
        submodules: recursive

    - name: (actions) Checkout holykeebs userspace overlay
      uses: actions/checkout@v4
      with:
        repository: holykeebs/qmk-userspace
        ref: hk-master
        path: qmk-userspace
        persist-credentials: false

    - name: Build
      id: build
      run: |
        git config --global --add safe.directory $(pwd)
        # The holykeebs userspace overlay checked out above. Resolved at runtime
        # from GITHUB_WORKSPACE: ${{ github.workspace }} would give the host
        # path, which doesn't exist inside this container. The Makefile exports
        # the variable to the keyboard sub-make.
        export QMK_USERSPACE="${GITHUB_WORKSPACE}/qmk-userspace"
        # Only the holykeebs boards are maintained in this fork; upstream vial
        # keyboards are not our concern and building all of them takes ~2h.
        targets=$(qmk find -km vial | grep '^holykeebs/' | sed "s/:vial$/:${KEYMAP}/")
        if [ -z "${targets}" ]; then
          echo "::error::no holykeebs vial targets found"
          exit 1
        fi
        if ! qmk mass-compile -j $(nproc) ${targets};
          then
          echo "::error::$(ls -1 .build/failed.log.* | wc -l) keymaps failed to build. See logs and/or job summary for details."
          exit 1
        fi

    - name: Dump failure logs
      if: ${{ failure() && steps.build.conclusion == 'failure' }}
      run: |
        echo '### Failure logs' | tee -a "${GITHUB_STEP_SUMMARY}"

        cd .build || exit 1
        for log in failed.log.*; do
          pretty_logname="$(echo "${log}" | sed "s/^failed\.log\.[0-9]\+\.// ; s/\.${KEYMAP}$//")"

          printf '\n::group::%s\n%s\n::endgroup::\n' "${pretty_logname}" "$(sed "${REGEX_MAKE_OUTPUT}" < "${log}")"
          printf '\n<details>\n<summary>%s</summary>\n\n```\n%s\n```\n\n</details>\n' \
             "${pretty_logname}" "$(sed "${REGEX_MAKE_OUTPUT} ; ${REGEX_ANSI_COLOR}" < "${log}")" >> "${GITHUB_STEP_SUMMARY}"
        done

  build-vial:
    name: Build Vial keymaps
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli@sha256:2dc05fc9f32efebd6b05c2b8676ee548358bc7e151e9dbf4dac6b6eed4513b07
    env:
      KEYMAP: vial

    steps:
    - name: (actions) Checkout Vial repo
      uses: actions/checkout@v4
      with:
        persist-credentials: false
        submodules: recursive

    - name: (actions) Checkout holykeebs userspace overlay
      uses: actions/checkout@v4
      with:
        repository: holykeebs/qmk-userspace
        ref: hk-master
        path: qmk-userspace
        persist-credentials: false

    - name: Build
      id: build
      run: |
        git config --global --add safe.directory $(pwd)
        # See build-default: the userspace overlay, resolved inside the container.
        export QMK_USERSPACE="${GITHUB_WORKSPACE}/qmk-userspace"
        # See build-default: holykeebs boards only.
        targets=$(qmk find -km "${KEYMAP}" | grep '^holykeebs/')
        if [ -z "${targets}" ]; then
          echo "::error::no holykeebs vial targets found"
          exit 1
        fi
        if ! qmk mass-compile -j $(nproc) ${targets};
          then
          echo "::error::$(ls -1 .build/failed.log.* | wc -l) keymaps failed to build. See logs and/or job summary for details."
          exit 1
        fi

    - name: Dump failure logs
      if: ${{ failure() && steps.build.conclusion == 'failure' }}
      run: |
        echo '### Failure logs' | tee -a "${GITHUB_STEP_SUMMARY}"

        cd .build || exit 1
        for log in failed.log.*; do
          pretty_logname="$(echo "${log}" | sed "s/^failed\.log\.[0-9]\+\.// ; s/\.${KEYMAP}$//")"

          printf '\n::group::%s\n%s\n::endgroup::\n' "${pretty_logname}" "$(sed "${REGEX_MAKE_OUTPUT}" < "${log}")"
          printf '\n<details>\n<summary>%s</summary>\n\n```\n%s\n```\n\n</details>\n' \
            "${pretty_logname}" "$(sed "${REGEX_MAKE_OUTPUT} ; ${REGEX_ANSI_COLOR}" < "${log}")" >> "${GITHUB_STEP_SUMMARY}"
        done
